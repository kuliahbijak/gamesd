<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FCF8FF">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Panel Guru — Petualangan Cerdas</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800;6..12,900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..600,0..1,0&display=block">
  <link rel="stylesheet" href="css/base.css?v=1.0.0">
  <link rel="stylesheet" href="css/admin.css?v=1.0.0">
</head>
<body class="app-admin">
  <a class="sr" href="#isi">Lewati ke konten utama</a>
  <div id="masuk"><div class="memuat" style="min-height:90vh"><div class="putar"></div></div></div>
  <div id="panel" hidden>
    <aside class="adm-sisi" id="sisi" aria-label="Menu panel">
      <div class="adm-merek"><div class="ikon"><span class="ik s28" aria-hidden="true">school</span></div><div><b id="merekNama">Petualangan Cerdas</b><small id="merekPeran">Panel Guru SD</small></div></div>
      <nav class="adm-nav" id="nav"></nav>
      <div class="adm-sisi-bawah">
        <a href="./" target="_blank" rel="noopener"><span class="ik" aria-hidden="true">sports_esports</span>Buka Aplikasi Siswa</a>
        <button type="button" data-aksi="bantuan"><span class="ik" aria-hidden="true">help_center</span>Bantuan &amp; Panduan</button>
        <button type="button" data-aksi="keluar"><span class="ik" aria-hidden="true">logout</span>Keluar</button>
      </div>
    </aside>
    <div class="tirai-sisi" id="tiraiSisi"></div>
    <div class="adm-utama">
      <header class="adm-atas" id="atas">
        <button class="btn hantu btn-ikon btn-menu" type="button" data-aksi="menu" aria-label="Buka menu"><span class="ik" aria-hidden="true">menu</span></button>
        <div class="remah" id="remah"></div>
        <div class="kanan">
          <label class="sr" for="pilihKelas">Kelas</label>
          <select class="isian pilih-kelas" id="pilihKelas"></select>
          <div class="cari-global"><span class="ik s20" aria-hidden="true">search</span><input class="isian" id="cariGlobal" type="search" placeholder="Cari siswa…" aria-label="Cari siswa"></div>
          <button class="profil-adm" type="button" data-aksi="profil" id="profilAdm" aria-haspopup="true"></button>
        </div>
      </header>
      <main class="adm-isi" id="isi" tabindex="-1"></main>
    </div>
  </div>

  <script src="js/config.js?v=1.0.0"></script>
  <script src="js/core.js?v=1.0.0"></script>
  <script src="js/admin.js?v=1.0.0"></script>
  <script src="js/admin-kelas.js?v=1.0.0"></script>
  <script src="js/admin-konten.js?v=1.0.0"></script>
  <script src="js/admin-laporan.js?v=1.0.0"></script>
  <script src="js/admin-notif.js?v=1.0.0"></script>
  <script src="js/admin-sistem.js?v=1.0.0"></script>
</body>
</html>
